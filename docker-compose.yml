services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: kiln
      POSTGRES_USER: kiln
      POSTGRES_PASSWORD: kiln
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kiln -d kiln"]
      interval: 2s
      timeout: 2s
      retries: 15
    volumes:
      - kiln-postgres:/var/lib/postgresql/data
    cpus: "1.0"
    mem_limit: 512m

  backend:
    build:
      context: ./app/backend
    environment:
      DATABASE_URL: postgresql://kiln:kiln@db:5432/kiln
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
    cpus: "1.0"
    mem_limit: 512m

  frontend:
    build:
      context: ./app/frontend
    depends_on:
      - backend
    ports:
      - "3000:3000"
    cpus: "1.0"
    mem_limit: 512m

networks:
  default:
    internal: true

volumes:
  kiln-postgres:
